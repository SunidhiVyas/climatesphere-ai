# Render Blueprint — deploys BOTH the FastAPI backend and the React frontend.
#
# One-click: https://render.com/deploy?repo=https://github.com/SunidhiVyas/climatesphere-ai
#
# URLs are derived from the service names below, so the two services are pre-wired:
#   API  -> https://climatesphere-api.onrender.com
#   Web  -> https://climatesphere-web.onrender.com
# If Render appends a suffix to either name (name already taken), update the
# matching CORS_ORIGINS / VITE_API_BASE value in the dashboard afterwards.
services:
  # ---------------------------------------------------------------- backend API
  - type: web
    name: climatesphere-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Paste a MongoDB Atlas connection string, or leave blank to run on the
      # in-memory store (demo only — nothing is persisted).
      - key: MONGO_URI
        sync: false
      - key: ALLOW_MOCK_DB
        value: "1"          # fall back to in-memory DB if Mongo is unreachable
      - key: TRUST_PROXY
        value: "1"          # Render terminates TLS in front of the app
      - key: CORS_ORIGINS
        value: https://climatesphere-web.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false         # optional: enables LLM-narrated insights

  # ------------------------------------------------------------- frontend (SPA)
  - type: web
    name: climatesphere-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_BASE
        value: https://climatesphere-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
