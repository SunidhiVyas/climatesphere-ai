# docker compose up --build   ->  API on :8000 (docs at /api/docs), MongoDB on :27017
services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
    healthcheck: { test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"], interval: 5s, retries: 10 }
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      ALLOW_MOCK_DB: "0"            # fail loudly instead of silently using an in-memory DB
      CORS_ORIGINS: http://localhost:5173
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on: { mongo: { condition: service_healthy } }
volumes: { mongo-data: {} }
